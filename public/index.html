<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Secret Media Vault</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card" id="setup" style="display: none">
      <h2 class="typewriter">Set passcode (only the first time)</h2>
      <p>
        This unique passcode encrypts all your files. Remember it — it cannot be recovered.
      </p>
      <form id="setupForm" autocomplete="off">
        <input
          id="secretSetup"
          type="password"
          placeholder="New secret passcode"
          autocomplete="new-password"
          required
        />
        <button id="setBtn" type="submit">Set passcode</button>
      </form>
      <p id="setupStatus" class="status"></p>
    </div>

    <div class="card" id="login" style="display: none">
      <h2>Login</h2>
      <p class="typewriter">Enter the secret passcode to access the media.</p>
      <form id="loginForm" autocomplete="off">
        <input
          id="secretLogin"
          type="password"
          placeholder="Passcode"
          autocomplete="current-password"
          required
        />
        <button id="loginBtn" type="submit">Enter</button>
      </form>
      <p id="loginStatus" class="status"></p>
    </div>

    <div class="card" id="app" style="display: none">
      <h2>Upload media</h2>
      <input id="title" placeholder="Title" maxlength="200" />
      <textarea id="desc" placeholder="Description (optional)" maxlength="7000"></textarea>
      <input id="tags" placeholder="tag1, tag2 (optional, max 15)" />
      <input id="file" type="file" multiple />
      <button id="uploadBtn">Upload</button>
      <p id="uploadStatus" class="status"></p>

      <hr />

      <h2 id="archiveTitle">Archive</h2>

      <div class="archive-section">
        <input id="search" placeholder="Search by tag or date (e.g. 2026-05)..." />
      </div>

      <div class="archive-section">
        <div id="results"></div>
      </div>
    </div>

    <div id="fullscreenOverlay">
      <div id="fsCloseBtn">✕</div>
      <div id="fsContainer">
        <img id="fsImage" />
        <video id="fsVideo" controls></video>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
