services:
  secret-media:
    build: .
    image: secret-media:latest
    container_name: secret-media
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATA_DIR: /data
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
    volumes:
      - secret-media-data:/data

volumes:
  secret-media-data:
